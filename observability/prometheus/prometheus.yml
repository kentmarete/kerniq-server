# Prometheus for the Kerniq local environment.
#
# Option A (compose profile `prometheus`): Prometheus scrapes the
#   application's own /metrics endpoint. No OpenTelemetry Collector involved.
# Option B (compose profile `otlp`): the application pushes OTLP to the
#   Collector, whose `prometheus` exporter is scraped on :8889.
#
# Both jobs are always configured; the one whose target is not running is
# reported as down and otherwise ignored.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Option A: native scraping. The app serves /metrics on a separate
  # listener (KERNIQ_METRICS_PORT=9464), so in production the port can be
  # firewalled to the Prometheus servers only.
  - job_name: kerniq-demo
    metrics_path: /metrics
    static_configs:
      - targets: ["kerniq-demo-prometheus:9464"]
        labels:
          architecture: option-a

  # Option B: metrics that went through the OpenTelemetry Collector.
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          architecture: option-b

  # The Collector's own health metrics (queue sizes, export failures).
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
