[package]
name = "tasks-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
kerniq-server = { version = "0.1.2" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
