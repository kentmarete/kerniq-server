[package]
name = "kerniq-http"
description = "Request extractors and response types for Kerniq Server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["json"]
# `Json<T>` extractor/response and `Created<T>`.
json = ["axum/json"]
# `ValidatedJson<T>` / `ValidatedQuery<T>` backed by the `validator` crate.
validation = ["json", "dep:validator"]
# Re-export Axum's WebSocket support.
websocket = ["axum/ws"]

[dependencies]
kerniq-core.workspace = true
axum.workspace = true
bytes.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
validator = { workspace = true, optional = true }

[dev-dependencies]
http-body-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
