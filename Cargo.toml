[workspace]
resolver = "3"
members = [
    "crates/kerniq-core",
    "crates/kerniq-http",
    "crates/kerniq-routing",
    "crates/kerniq-runtime",
    "crates/kerniq-middleware",
    "crates/kerniq-openapi",
    "crates/kerniq-macros",
    "crates/kerniq-server",
    "crates/kerniq-cli",
    "benches",
    "examples/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kerniqq/kerniq-server"
homepage = "https://github.com/kerniq/kerniq-server"
authors = ["Kerniq Server Contributors"]
keywords = ["web", "http", "framework", "async", "axum"]
categories = ["web-programming::http-server", "asynchronous", "network-programming"]

[workspace.dependencies]
# Internal crates
kerniq-core = { path = "crates/kerniq-core", version = "0.1.0" }
kerniq-http = { path = "crates/kerniq-http", version = "0.1.0", default-features = false }
kerniq-routing = { path = "crates/kerniq-routing", version = "0.1.0" }
kerniq-runtime = { path = "crates/kerniq-runtime", version = "0.1.0" }
kerniq-middleware = { path = "crates/kerniq-middleware", version = "0.1.0", default-features = false }
kerniq-openapi = { path = "crates/kerniq-openapi", version = "0.1.0" }
kerniq-macros = { path = "crates/kerniq-macros", version = "0.1.0" }
kerniq-server = { path = "crates/kerniq-server", version = "0.1.0", default-features = false }

# HTTP stack
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "http2", "query", "original-uri", "matched-path"] }
http = "1.3"
axum-core = "0.5.2"
http-body-util = "0.1.3"
bytes = "1.10"
pin-project-lite = "0.2.16"
hyper = { version = "1.6", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.16", features = ["server-auto", "server-graceful", "service", "tokio", "http1", "http2"] }
tower = { version = "0.5.2", default-features = false }
tower-http = { version = "0.7.1", default-features = false }

# Runtime
tokio = { version = "1.47", default-features = false }
tokio-util = { version = "0.7.16", default-features = false }
futures-util = { version = "0.3.31", default-features = false }

# Serialization, errors, diagnostics
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.12"
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
toml = { version = "1.0", default-features = false, features = ["parse", "serde"] }

# Procedural macros
proc-macro2 = "1.0.95"
quote = "1.0.40"
syn = { version = "2.0.104", default-features = false, features = ["clone-impls", "full", "parsing", "printing", "proc-macro"] }

# Optional capabilities
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }
validator = { version = "0.21.0", features = ["derive"] }

# Tooling / tests
clap = { version = "4.5", features = ["derive"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
tokio-tungstenite = "0.30"
criterion = { version = "0.8", features = ["async_tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
debug = 1
