[package]
name = "kerniq-middleware"
description = "Production middleware for Kerniq Server: logging, request IDs, timeouts, CORS, compression, rate limiting, auth, metrics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["tracing"]
# `Logger` (tower-http TraceLayer with Kerniq span fields).
tracing = ["tower-http/trace"]
# `Cors` (tower-http CorsLayer).
cors = ["tower-http/cors"]
# `Compression` (gzip, deflate, brotli, zstd).
compression = ["tower-http/compression-full"]

[dependencies]
kerniq-core.workspace = true
kerniq-routing.workspace = true
axum.workspace = true
http.workspace = true
pin-project-lite.workspace = true
tokio = { workspace = true, features = ["time"] }
tower = { workspace = true, features = ["limit", "util"] }
tower-http = { workspace = true, features = ["request-id", "util"] }
tracing.workspace = true

[dev-dependencies]
http-body-util.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
